# =============================================================================
# docker-compose.yml — VaN3Twin en Docker Desktop para macOS (Apple Silicon)
#
# Uso:
#   docker compose build          # construye la imagen (1-3 h la primera vez)
#   docker compose up -d          # arranca el contenedor en segundo plano
#   docker compose exec van3twin bash   # abre una shell dentro del contenedor
#   docker compose down           # detiene y elimina el contenedor
#   docker compose --profile visor up -d   # van3twin + visor 3D SUMO-GEO (:8081)
#
# El árbol de VaN3Twin (código + build de ns-3) vive en el VOLUMEN NOMBRADO
# ns3-workspace (case-sensitive, E/S rápida en la VM). Si el volumen está
# vacío en el primer arranque, Docker lo puebla automáticamente con el
# contenido de la imagen (ns-3 ya compilado).
#
# El código se EDITA DIRECTAMENTE en el volumen: shell del contenedor
# (docker compose exec van3twin bash + nano/vim) o VS Code con la extensión
# Dev Containers adjuntada al contenedor 'van3twin'. Tras editar C++:
#   docker compose exec van3twin ./ns3 build
#
# NOTA (2026-08-25): NO usar un bind mount del Mac para este árbol. APFS es
# case-insensitive y el repo tiene pares de ficheros que solo difieren en
# mayúsculas (boolean.h/BOOLEAN.h, integer.h/INTEGER.h, ActionID/ActionId…):
# colapsan entre sí y la compilación se rompe.
# =============================================================================

name: van3twin

services:
  van3twin:
    # -------------------------------------------------------------------
    # build: construye la imagen desde el Dockerfile de este directorio.
    # image: nombre/etiqueta con que queda registrada la imagen local.
    # -------------------------------------------------------------------
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GRPC_VERSION: v1.60.0
        VAN3TWIN_REF: master
        # fork con la integración SUMO-GEO incluida (parches en master)
        VAN3TWIN_REPO: https://github.com/Pbarbecho/VaN3TwinGEO.git

    image: van3twin:jammy

    # -------------------------------------------------------------------
    # platform: arquitectura de la imagen — debe coincidir con el procesador
    # del PC (verificar con `uname -m` en la terminal Ubuntu/WSL2 o macOS):
    #   * x86_64  -> linux/amd64  (PC Windows/Linux Intel-AMD, Mac Intel)
    #   * arm64   -> linux/arm64  (Mac Apple Silicon M1/M2/M3/M4)
    # Con la arquitectura equivocada Docker emula con QEMU/Rosetta: el build
    # de ns-3 (1-3 h nativo) se multiplica varias veces o falla. Cambiarla
    # despues de construir obliga a reconstruir desde cero.
    # -------------------------------------------------------------------
    platform: linux/amd64          # ACTIVA: PC Windows/Linux x86_64
    # platform: linux/arm64        # Mac Apple Silicon (descomentar y comentar la de arriba)

    container_name: van3twin
    hostname: van3twin

    # -------------------------------------------------------------------
    # tty + stdin_open (= docker run -it): mantienen vivo el bash del CMD.
    # Sin ellos, el contenedor terminaría inmediatamente tras arrancar.
    # -------------------------------------------------------------------
    tty: true
    stdin_open: true

    # -------------------------------------------------------------------
    # command: al arrancar el contenedor se levantan automáticamente el
    # X virtual (Xvfb :99 con GLX), el gestor de ventanas fluxbox y el
    # servidor VNC (x11vnc, puerto 5900), y después queda una shell como
    # proceso principal. Uso diario sin scripts:
    #   open vnc://127.0.0.1:5901   +   docker compose exec van3twin bash
    # El `if` protege contenedores creados con una imagen antigua sin
    # xvfb (reconstruir la imagen para tener la GUI completa).
    # -------------------------------------------------------------------
    command: >
      bash -c "
        if command -v Xvfb >/dev/null 2>&1; then
          (Xvfb :99 -screen 0 1680x1050x24 +extension GLX +render -noreset 2>/dev/null &);
          sleep 1;
          command -v fluxbox >/dev/null 2>&1 && (DISPLAY=:99 fluxbox 2>/dev/null &);
          command -v x11vnc >/dev/null 2>&1 &&
            x11vnc -display :99 -nopw -forever -shared -rfbport 5900
                   -listen 0.0.0.0 -quiet -bg 2>/dev/null;
        fi;
        exec bash"

    working_dir: /home/vanet/VaN3Twin/ns-3-dev

    # -------------------------------------------------------------------
    # environment — GUI por VNC (opción por defecto, la más robusta):
    #   DISPLAY :99 -> el X virtual (Xvfb) que arranca el `command` de
    #              arriba; se ve desde el Mac en vnc://127.0.0.1:5900.
    #   LIBGL_ALWAYS_SOFTWARE -> OpenGL por software (Mesa llvmpipe)
    #              dentro del contenedor; no depende de GLX externo.
    #   SUMO_HOME -> lo usan las herramientas de SUMO y los scripts TraCI.
    #
    # Alternativa XQuartz (X11 en red): comentar DISPLAY y
    # LIBGL_ALWAYS_SOFTWARE de arriba, descomentar las dos líneas de abajo
    # y `docker compose up -d`. Requiere en el Mac: "Allow connections
    # from network clients", `defaults write org.xquartz.X11 enable_iglx
    # -bool true` + reinicio de XQuartz, y `xhost + 127.0.0.1`.
    # Si XQuartz da GLXBadContext, volver a la opción VNC.
    # -------------------------------------------------------------------
    environment:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
      SUMO_HOME: /usr/share/sumo
      # DISPLAY: host.docker.internal:0
      # LIBGL_ALWAYS_INDIRECT: "1"

      # -------------------------------------------------------------------
      # volumes:
      #   1) VOLUMEN NOMBRADO ns3-workspace sobre el árbol de VaN3Twin:
      #      case-sensitive (obligatorio para compilar, ver encabezado) y
      #      E/S rápida. Persiste entre recreaciones del contenedor; solo
      #      se pierde con `docker compose down -v`. Si está vacío en el
      #      primer arranque, Docker lo puebla desde la imagen.
      #   2) Bind mount ./results para extraer ficheros de salida
      #      (trazas, .csv, .pcap) directamente al Mac.
      # -------------------------------------------------------------------
    volumes:
      - ns3-workspace:/home/vanet/VaN3Twin
      - ./results:/home/vanet/results

    # -------------------------------------------------------------------
    # ports: 8080 -> vehicle-visualizer (servidor web Node.js del módulo
    # src/vehicle-visualizer). Solo necesario si se usa el visualizador;
    # el socket UDP 48110 del visualizador es interno al contenedor y no
    # necesita publicarse.
    # -------------------------------------------------------------------
    ports:
      # vehicle-visualizer en el 8080 del Mac (como documenta la guía).
      # OJO: no usar 8081 aquí — lo ocupa el frontend de SUMO-GEO.
      - "8080:8080"
      # VNC para la GUI sin XQuartz (Xvfb + x11vnc dentro del contenedor,
      # arrancados por el `command`). Se abre en el Mac con vnc://127.0.0.1:5901
      # (app integrada "Compartir pantalla"). Solo escucha en localhost.
      # Se publica en el 5901 del Mac porque el 5900 suele estar ocupado
      # por el propio servicio "Compartir pantalla"/Gestión remota de macOS
      # ("bind: address already in use"). Dentro del contenedor sigue
      # siendo 5900.
      - "127.0.0.1:5901:5900"
      # GEO SUMO WEB en modo vivo: servir ns-3-dev por HTTP para que la app
      # relea los CSV de --csv-log durante la simulación. Dentro del
      # contenedor:  cd ~/VaN3Twin/ns-3-dev && python3 -m http.server 8090
      - "127.0.0.1:8090:8090"

    # -------------------------------------------------------------------
    # Recursos: la compilación/simulación de ns-3 es intensiva.
    #   shm_size : /dev/shm por defecto es 64 MB; Qt/OpenCV/sumo-gui
    #              pueden agotarlo.
    #   mem_limit: tope de RAM del contenedor. Debe ser <= a la RAM
    #              asignada a la VM de Docker Desktop (Settings->Resources).
    #   cpus     : número de núcleos. Más núcleos = build más rápido, pero
    #              cada hilo de compilación puede consumir 1-2 GB de RAM.
    # Ajustar según el Mac (ej.: M2 Pro con 16 GB -> cpus: 6, mem: 10g).
    # -------------------------------------------------------------------
    shm_size: 1gb
    mem_limit: 10g
    cpus: 6

    # Contenedor interactivo de desarrollo: no reiniciar automáticamente.
    restart: "no"

  # ---------------------------------------------------------------------------
  # Visor 3D SUMO-GEO — profile "visor": NO arranca con `docker compose up`;
  # activarlo con:  docker compose --profile visor up -d
  # (arranca también van3twin por el depends_on). El backend se conecta por
  # TraCI multi-cliente al SUMO que lanza ns-3 (puertos 3400-3410) y lee la
  # geometría del volumen ns3-workspace.
  #
  # AUTOCONTENIDO (2026-08-29): las imágenes clonan el repo SUMO_GEO durante
  # el build (sumo-geo.Dockerfile) — basta clonar van3twin-docker. Para traer
  # los últimos cambios tras un push del repo SUMO_GEO:
  #   docker compose --profile visor build --no-cache backend frontend && \
  #   docker compose --profile visor up -d
  # Desarrollo con el repo LOCAL (editar y recargar): docker-compose.dev.yml
  # (se activa con COMPOSE_FILE en el .env local, ver ese fichero).
  # ---------------------------------------------------------------------------
  backend:
    profiles: [visor]
    build:
      context: .
      dockerfile: sumo-geo.Dockerfile
      target: backend
      args:
        SUMO_GEO_REPO: https://github.com/Pbarbecho/SUMO_GEO.git
        SUMO_GEO_REF: main
    depends_on:
      - van3twin
    environment:
      APP_SUMO_MODE: remote
      APP_SUMO_HOST: van3twin         # nombre del servicio en esta misma red
      APP_SUMO_PORT: "3400"           # el ejemplo EVA fija SumoPort=3400
      APP_SUMO_PORT_SCAN: "10"        # probar 3400-3410 (ns-3 corre el puerto si hay TIME_WAIT)
      APP_SUMO_ORDER: "2"             # ns-3 es el cliente 1; el visor, el 2
      # Escenario Cuenca (copiar mapa_cuenca/cuenca a results/: queda en
      # /replay dentro del backend). Escenario EVA por defecto:
      # APP_NET_FILE: /ns3/ns-3-dev/src/automotive/examples/sumo_files_v2v_map/map.net.xml
      APP_NET_FILE: /replay/cuenca/cuenca.net.xml
      APP_POLY_FILE: /no_poly.xml     # inexistente a propósito: evita el fallback al .sumocfg
      APP_STEP_LENGTH: "0.5"          # seg simulados por frame; 0.5 + interpolación en el
                                      # frontend = movimiento fluido (1.0 se veía a saltos)
      APP_MAX_FPS: "10"
      # replay offline (botón "Replay pcap" del visor): pcaps copiados a
      # ~/results tras la corrida (cp v2v-EVA-*.pcap ~/results/). Los .asn
      # para decodificar salen del volumen (APP_ASN_DIR por defecto).
      APP_REPLAY_PATTERN: "v2v-*.pcap"
    volumes:
      - ns3-workspace:/ns3:ro
      - ./results:/replay:ro
    ports:
      - "8000:8000"

  frontend:
    profiles: [visor]
    build:
      context: .
      dockerfile: sumo-geo.Dockerfile
      target: frontend
      args:
        SUMO_GEO_REPO: https://github.com/Pbarbecho/SUMO_GEO.git
        SUMO_GEO_REF: main
    depends_on:
      - backend
    ports:
      - "8081:80"

# Volumen nombrado del árbol ns-3 (nombre real: van3twin_ns3-workspace).
# Lo comparten van3twin (lectura/escritura) y el backend del visor (RO).
volumes:
  ns3-workspace:
