<?xml version="1.0" encoding="UTF-8"?>
<configuration> 

<input>
        <net-file value="cuenca.net.xml"/>
        <route-files value="cuenca.rou.xml"/>
        <additional-files value="cuenca.poly.xml"/>
</input>    

<output>
   	 <tripinfo-output value="tripinfo.xml"/>
</output>


<emissions>
	<device.emissions.probability value="1"/>
</emissions>

    
<processing>
        <ignore-route-errors value="true"/>
</processing>    

<time>
        <begin value="0"/>
        <end value="3600"/>
        <step-length value="1"/>
</time>

</configuration> 
