# =============================================================================
# docker-compose.dev.yml — override de DESARROLLO del visor SUMO-GEO
#
# Restaura el flujo "editar y recargar" contra el repo LOCAL (SUMO_GEO_DIR del
# .env, default ../SUMO_GEO), en lugar de las imágenes autocontenidas que
# clonan el repo de GitHub:
#   - backend: se construye desde el repo local (tras editar: --build backend)
#   - frontend: bind mount del dir frontend/ (editar y recargar, sin rebuild)
#
# Activación permanente (recomendada para Pablo): añadir al .env local
# (no versionado, junto a SUMO_GEO_DIR):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
# Con eso, TODOS los comandos `docker compose ...` de siempre usan el repo
# local sin escribir -f. Los estudiantes, sin .env, usan el modo autocontenido.
#
# Activación puntual:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile visor up -d
# =============================================================================
services:
  backend:
    build:
      context: ${SUMO_GEO_DIR:-../SUMO_GEO}/backend
      dockerfile: Dockerfile.van3twin
      # el target "backend" heredado del compose base también existe en el
      # Dockerfile local (stage nombrado AS backend) — no hace falta resetearlo

  frontend:
    volumes:
      - ${SUMO_GEO_DIR:-../SUMO_GEO}/frontend:/usr/share/nginx/html:ro
      - ${SUMO_GEO_DIR:-../SUMO_GEO}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
